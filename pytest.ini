[pytest]
# Repo root on sys.path, so `pytest -q` works from a clean clone with no
# PYTHONPATH set and no editable install -- the phase 7 checkpoint is the bare
# command, so it must not depend on the caller's environment.
pythonpath = .

testpaths = tests
python_files = test_*.py

# Fail on an unregistered mark rather than silently skipping the test.
addopts = --strict-markers
